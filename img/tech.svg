    .text-main {
      font: bold 32px Arial, sans-serif;
      fill: #ffffff;
    }
    .text-accent {
      font: bold 32px Arial, sans-serif;
      fill: #ff6600;
    }
  </style>

  <rect width="300" height="80" rx="10" fill="#0d0d0d"/>

  <text x="20" y="50" class="text-main">TECH</text>
